[workspace]
resolver = "2"
members = ["crates/build-agent", "crates/build-agent-contracts"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[workspace.dependencies]
build-agent-contracts = { path = "crates/build-agent-contracts" }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.31"
fs2 = "0.4.3"
hostname = "0.4.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
safe-write = "0.2.0"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
strip = true
