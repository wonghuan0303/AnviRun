name: 缺陷报告
description: 报告可以稳定复现的错误
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请勿在此公开提交，请改用仓库的 Security Advisory。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你预期发生什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供可以稳定复现问题的最小步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 请填写版本号或 Commit SHA。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、Node.js、pnpm、Rust、PostgreSQL、浏览器及部署方式等。
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先移除令牌、密码、内部地址和其他敏感信息。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告。
          required: true
        - label: 此报告不包含真实凭据或未公开的安全漏洞。
          required: true
