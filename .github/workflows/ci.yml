name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Web / Server / contracts / PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buildplatform
          POSTGRES_PASSWORD: buildplatform_ci_only
          POSTGRES_DB: buildplatform_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U buildplatform -d buildplatform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://buildplatform:buildplatform_ci_only@127.0.0.1:54329/buildplatform_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Apply database migrations
        run: pnpm run db:migrate:deploy

      - name: Seed database twice (idempotency)
        run: |
          pnpm run db:seed
          pnpm run db:seed

      - name: Database integration tests
        run: pnpm run db:test

      - name: Lint (Prettier 格式检查 + ESLint 静态检查)
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  agent:
    name: Rust Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --locked

      - name: Build
        run: cargo build --locked
